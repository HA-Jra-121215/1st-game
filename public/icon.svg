<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1b"/>
      <stop offset="50%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#05060d"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#neonGlow)" stroke-width="4" opacity="0.6"/>

  <!-- Geometric energy vortex -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7928ca" stroke-width="3" stroke-dasharray="16 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.3"/>

  <!-- Dynamic Shadow Runner silhouette -->
  <g filter="url(#glow)">
    <!-- Speed streaks -->
    <path d="M 80 290 L 190 280" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 60 330 L 210 320" stroke="#ff0080" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <path d="M 90 370 L 230 365" stroke="#7928ca" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

    <!-- Runner Body: Stylized angular ninja / runner -->
    <!-- Head & Visor -->
    <polygon points="280,110 320,135 305,175 260,155" fill="#1e223d" stroke="#00f5d4" stroke-width="3"/>
    <path d="M 285 142 L 318 144" stroke="#00f5d4" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Torso -->
    <polygon points="260,165 315,170 330,265 245,250" fill="#13162b" stroke="#7928ca" stroke-width="3"/>
    <!-- Glowing Chest Core -->
    <circle cx="285" cy="210" r="12" fill="#00f5d4"/>
    <circle cx="285" cy="210" r="20" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.7"/>

    <!-- Leading Arm / Energy Blade -->
    <path d="M 290 190 L 380 180 L 430 220" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 380 180 L 460 160" fill="none" stroke="url(#bladeGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Trailing Arm -->
    <path d="M 255 195 L 180 210 L 140 260" fill="none" stroke="#4a5568" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Forward Stride Leg -->
    <path d="M 290 260 L 350 330 L 390 420" fill="none" stroke="#00f5d4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Back Leg Dynamic Push -->
    <path d="M 255 255 L 190 310 L 130 340" fill="none" stroke="#7928ca" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title Monogram / Energy Rune -->
  <text x="256" y="475" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="6" opacity="0.95">SHADOW ESCAPE</text>
</svg>
